<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--seo:head-->
    <!-- A link, not an import in the script: the style is there before the first frame (also in the dev server). -->
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body>
    <!-- Everything outside #app is there before any script runs (and stays for
         people and search engines without one); the script fills #app. -->
    <header class="topbar">
      <div class="shell">
        <!--seo:brand-->
        <nav>
          <!--seo:nav-->
        </nav>
      </div>
    </header>
    <section class="hero" id="top">
      <div class="shell">
        <div class="hero-text">
          <!--seo:header-->
        </div>
        <!--seo:art-->
      </div>
    </section>
    <noscript><p class="part failure"><!--seo:noscript--></p></noscript>
    <!--seo:notice-->
    <main class="part" id="app"></main>
    <section class="shell about" id="about">
        <!--seo:about-->
    </section>
    <footer class="part">
      <p><!--seo:privacy--></p>
      <p class="engine" id="engine" hidden></p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
