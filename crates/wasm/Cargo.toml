[package]
name = "img2ico-wasm"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "WebAssembly bindings of img2ico-core for the web version."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
img2ico-core = { path = "../core" }
wasm-bindgen = "0.2"
serde_json = "1"
