version: 2

updates:
  # Rust dependencies (Cargo.toml / Cargo.lock)
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Keep the number of open pull requests small; every one runs the full CI.
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    groups:
      # Patch and minor updates arrive as one pull request per week.
      # Major updates stay separate, since they may need code changes.
      rust-minor-and-patch:
        update-types:
          - minor
          - patch

  # The web page's npm packages (web/package.json, web/package-lock.json).
  # The page is built by CI on every pull request (the "Web" workflow), so an
  # update that breaks the type check, the tests or the build shows up there.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    ignore:
      # svelte-check (the page's type check) accepts TypeScript 5 and 6 only; with TypeScript 7 `npm ci` stops on the
      # peer dependency. Take this out when a svelte-check release lists TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # The actions the workflows use (uses: ... in .github/workflows).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    ignore:
      # The tag of this action is the Rust version it installs (ci.yml checks the minimum supported version with
      # @1.88, which must stay what `rust-version` in Cargo.toml says), not a version of the action. The other uses
      # follow `@stable`, which Dependabot does not touch.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        update-types:
          - minor
          - patch
