name: Web

# Checks and builds the web version (web/ and the engine it runs, crates/).
# It runs on pull requests and pushes to main that touch those files - a
# path filter is fine here because, unlike the Rust checks in ci.yml, this
# workflow is not one the protected main branch waits for. The finished page
# is kept as a build artifact: download "web-dist" and open it with any static
# file server to try the pull request's page.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Check and build the page
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # The wasm-bindgen tool must be exactly the version the engine uses
      # (build-wasm.mjs checks this). Installing it takes minutes, so the
      # result is cached under that version.
      - name: Find the wasm-bindgen version
        id: bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the wasm-bindgen tool
        id: bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-${{ steps.bindgen.outputs.version }}

      - name: Install the wasm-bindgen tool
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version ${{ steps.bindgen.outputs.version }} --locked

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the page's dependencies
        working-directory: web
        run: npm ci

      # The page imports the engine's generated glue code, so the engine has
      # to be built before the type check can find it.
      - name: Build the engine (WebAssembly)
        working-directory: web
        run: npm run build:wasm

      - name: Type-check the page
        working-directory: web
        run: npm run check

      - name: Run the page's tests
        working-directory: web
        run: npm test

      - name: Build the page
        working-directory: web
        run: npx vite build

      - name: Keep the built page
        uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: web/dist
