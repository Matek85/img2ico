name: Build

# Runs ONLY when a version tag like "v1.3.0" is pushed (builds on all
# platforms AND publishes a GitHub Release with the binaries attached),
# or when triggered manually from the GitHub UI ("Run workflow" button)
# via workflow_dispatch (build only, no release). Plain pushes to main
# and pull requests do NOT trigger anything.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  # Builds a native release binary on real Windows, macOS, and Linux
  # runners - not a cross-compile from a single OS, but three genuinely
  # separate machines, each building for itself. That's what guarantees
  # the result actually works on each platform.
  build:
    name: Build (${{ matrix.os }})
    strategy:
      # fail-fast: false means if e.g. the Windows build fails, the macOS
      # and Linux builds still run to completion instead of being
      # cancelled - useful for seeing all three results at once.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Caches ~/.cargo and target/ between runs, keyed by Cargo.lock.
      # Without this, every run recompiles every dependency from scratch,
      # which costs both time and (on a private repo) billed minutes.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # Runs the full test suite (unit tests plus the end-to-end tests in
      # tests/) natively on every platform BEFORE anything is built for
      # release: a failing test fails this job, and since the verify and
      # release jobs depend on it, a red test suite means no GitHub
      # Release gets published for that tag.
      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      # Bundles the platform binary together with examples/, README.md
      # and LICENSE into a single downloadable archive - so anyone
      # grabbing a release doesn't get just a bare .exe/binary with
      # nothing else, but a self-contained package including the
      # ready-to-use settings-file examples and the documentation that
      # explains how to use them. Two separate steps (Windows vs.
      # macOS/Linux) because the two platforms don't share a common
      # built-in archive tool: Windows runners use PowerShell's
      # Compress-Archive, macOS/Linux runners use the "zip" command
      # (preinstalled on both GitHub-hosted images) - each step only
      # runs on its matching platform via "if:".
      - name: Package release bundle (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path img2ico-windows | Out-Null
          Copy-Item target/release/img2ico.exe img2ico-windows/
          Copy-Item -Recurse examples img2ico-windows/examples
          Copy-Item README.md img2ico-windows/
          Copy-Item LICENSE img2ico-windows/
          Compress-Archive -Path img2ico-windows -DestinationPath img2ico-windows.zip

      - name: Package release bundle (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            os_name=macos
          else
            os_name=linux
          fi
          folder="img2ico-$os_name"
          mkdir "$folder"
          cp target/release/img2ico "$folder/"
          cp -r examples "$folder/examples"
          cp README.md "$folder/"
          cp LICENSE "$folder/"
          zip -r "img2ico-$os_name.zip" "$folder"

      - name: Upload release bundle
        uses: actions/upload-artifact@v6
        with:
          name: img2ico-${{ matrix.os }}
          path: img2ico-*.zip

  # Bonus verification step: generates a real .icns file on an actual
  # macOS runner, then decomposes it again using Apple's OWN "iconutil"
  # tool. If Apple's own tooling can successfully unpack the file we
  # produced, that's about as strong a real-world confirmation of the
  # .icns format as we can get without a person physically checking it in
  # Finder - see the img2ico README/write_icns() doc comment for the full
  # context on why this mattered (the format was originally verified
  # without any access to a real Mac at all).
  verify-icns-on-macos:
    name: Verify .icns with native macOS tools
    needs: build
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Generate a test .icns file
        run: ./target/release/img2ico .github/testdata/logo.png --output-format icns -o test.icns --force

      - name: Decompose the .icns with Apple's own iconutil
        run: |
          iconutil -c iconset test.icns -o verified.iconset
          echo "iconutil successfully unpacked the .icns file - contents:"
          ls -la verified.iconset

      - name: Inspect with sips (macOS's built-in image tool)
        run: sips -g all test.icns

      - name: Upload the generated .icns and its decomposed iconset
        uses: actions/upload-artifact@v6
        with:
          name: icns-verification
          path: |
            test.icns
            verified.iconset

  # Only runs when the trigger was a version tag (e.g. "v1.2.0"), not on
  # ordinary pushes to main or pull requests - see the "tags" trigger
  # above. Publishes a proper GitHub Release with the three platform
  # bundles attached as downloadable assets: permanent, publicly
  # linkable, no login required, and prominently shown on the repo's main
  # page - unlike the plain build artifacts above, which expire and
  # require being logged in to even find.
  release:
    name: Publish GitHub Release
    needs: [build, verify-icns-on-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is often read-only for repository contents
    # depending on the repo's settings - creating a Release requires
    # explicit write access, so this is spelled out rather than assumed.
    permissions:
      contents: write
    steps:
      - name: Download all three platform bundles from the build job
        uses: actions/download-artifact@v7
        with:
          pattern: img2ico-*
          path: artifacts

      # Each platform's zip is already named distinctly by the packaging
      # step in the build job (img2ico-windows.zip / img2ico-macos.zip /
      # img2ico-linux.zip), so unlike before, no renaming is needed here -
      # just collect them all into one flat folder to hand to the release
      # action.
      - name: Collect the packaged bundles for the release
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          ls -la release/

      - name: Create the GitHub Release with the bundles attached
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          # Auto-fills the release description from the commits since the
          # previous tag, instead of requiring a hand-written changelog
          # for every release.
          generate_release_notes: true