name: CI

# The checks every change has to pass. Runs on every pull request and on every
# push to main that touches code, builds and tests on real Windows, macOS and
# Linux machines, and can also be started by hand ("Run workflow" button) or
# called by the release workflow, which uses it as its gate.
#
# Work reaches main through pull requests, and main is protected: a pull
# request can only be merged when the checks below have passed. That is why
# the pull request trigger has NO path filter - a pull request that only
# touches the web page or the documentation would otherwise never get these
# checks and could never be merged.
#
# Instead the "changes" job below looks at which files a pull request touches.
# When they are all web or documentation files, the Rust checks are skipped:
# they still appear (and count as passed, which is what the protected main
# branch needs) but start no work. Anything else - and every run that is not a
# pull request, such as the release gate - runs everything.
#
# A push to a pull request that already changed Rust code is judged by what
# that push changed, not by the whole pull request: a web-only push does not
# run the Rust checks again - but only if the Rust checks of the commit before
# it passed. Otherwise a failing Rust check could be "fixed" by a web-only
# push that skips it.
#
# For pushes to main (the merges) web and documentation-only changes are
# skipped outright: the pull request that brought them in was already checked.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'web/**'
      - 'LICENSE'
      - '.markdownlint.json'
      - '.gitignore'
      - '.github/workflows/web.yml'
      - '.github/dependabot.yml'
  pull_request:
  workflow_dispatch:
  workflow_call:

# Nothing here writes to the repository.
permissions:
  contents: read

# A newer run for the same branch or tag makes an older, still running one
# pointless, so it is cancelled instead of burning minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether the Rust checks have anything to check. Fails safe: a file
  # that is not clearly web or documentation counts as Rust, and so does
  # anything that cannot be determined.
  changes:
    name: Which files changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Look at the changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request: running everything."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A push to an open pull request: only what this push changed counts,
          # provided the Rust checks of the commit before it passed.
          scope="the whole pull request"
          files=""
          if [ "$ACTION" = "synchronize" ] && [ -n "$BEFORE" ]; then
            files=$(gh api "repos/$REPOSITORY/compare/$BEFORE...$AFTER" --paginate \
              --jq '.files[] | .filename, (.previous_filename // empty)' 2>/dev/null || true)
            if [ -n "$files" ]; then
              scope="this push"
              all_passed=true
              for name in "Format" "Test (windows-latest)" "Test (macos-latest)" "Test (ubuntu-latest)" \
                          "Rust 1.88 (minimum supported)" "Verify with native macOS tools (iconutil, sips)"; do
                result=$(gh api "repos/$REPOSITORY/commits/$BEFORE/check-runs?per_page=100" \
                  --jq "[.check_runs[] | select(.name == \"$name\")] | sort_by(.started_at) | last | .conclusion" \
                  2>/dev/null || true)
                if [ "$result" != "success" ]; then
                  echo "  The commit before this push has no passing '$name' (it says '${result:-nothing}')."
                  all_passed=false
                fi
              done
              if [ "$all_passed" != true ]; then
                echo "Judging the whole pull request instead."
                scope="the whole pull request"
                files=""
              fi
            fi
          fi
          if [ -z "$files" ]; then
            files=$(gh api "repos/$REPOSITORY/pulls/$PULL_REQUEST/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)')
          fi
          echo "Looking at $scope:"
          if [ -z "$files" ]; then
            echo "No file list: running everything."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rust=false
          while IFS= read -r file; do
            case "$file" in
              web/*|docs/*|*.md|LICENSE|.markdownlint.json|.gitignore|.github/workflows/web.yml|.github/dependabot.yml)
                echo "  web/docs:  $file" ;;
              *)
                echo "  Rust:      $file"
                rust=true ;;
            esac
          done <<< "$files"
          echo "Rust checks needed: $rust"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  # Formatting only needs checking once - it does not depend on the platform.
  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # "cargo fmt --check" only verifies, it never rewrites anything.
      - name: Check formatting
        run: cargo fmt --all --check

  # Lints and tests on three genuinely separate machines - not a
  # cross-compile from one OS. Clippy runs on each of them too, because some
  # code only exists on one platform (Windows paths, the macOS default
  # output format) and would otherwise never be linted.
  #
  # The conditions are on the steps, not on the job: a matrix job that is
  # skipped as a whole is reported under its unexpanded name, and the three
  # "Test (<os>)" checks the protected main branch waits for would never
  # arrive. A job that runs but skips its steps reports correctly.
  test:
    name: Test (${{ matrix.os }})
    needs: changes
    strategy:
      # If one platform fails, the others still run to completion, so all
      # three results are visible at once.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Caches ~/.cargo and target/ between runs, keyed by Cargo.lock.
      - name: Cache Cargo dependencies
        if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2

      # "-D warnings" turns every clippy warning into an error so they can't
      # pile up unnoticed. --workspace covers the shared core and the
      # WebAssembly bindings too, not only the command line.
      - name: Lint with clippy
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The unit tests plus the end-to-end tests in tests/, which start the
      # real binary.
      - name: Run tests
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --workspace --locked

      - name: Nothing to check here
        if: needs.changes.outputs.rust != 'true'
        run: echo "Only web or documentation files changed - the Rust checks are skipped."

  # The oldest Rust version the project says it supports (rust-version in
  # Cargo.toml). Everything else here uses the newest stable; without this
  # job the promise in Cargo.toml would never be checked.
  minimum-rust-version:
    name: Rust 1.88 (minimum supported)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Keep this in step with rust-version in Cargo.toml.
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --locked

  # What can only be checked on a real Mac, in BOTH directions:
  #   - what we WRITE: an .icns made by img2ico must be unpackable by Apple's
  #     own "iconutil" (the format was originally built without any access to
  #     a Mac, so this is the real-world confirmation);
  #   - what we READ: files made by Apple's own tools - an .icns from
  #     "iconutil", TIFF/JPEG/BMP/GIF/TGA from "sips" - must be readable as
  #     source images. A reader tested only against files our own writer made
  #     would prove very little; these come from a different implementation.
  verify-icns-on-macos:
    name: Verify with native macOS tools (iconutil, sips)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Generate a test .icns file
        run: ./target/release/img2ico .github/testdata/logo.png --output-format icns -o test.icns --force

      - name: Decompose the .icns with Apple's own iconutil
        run: |
          iconutil -c iconset test.icns -o verified.iconset
          echo "iconutil successfully unpacked the .icns file - contents:"
          ls -la verified.iconset

      - name: Inspect with sips (macOS's built-in image tool)
        run: sips -g all test.icns

      # --- the other direction: files made by Apple's tools, read by us ---

      # An .icns that comes out of Apple's own encoder: an iconset (the
      # ten standard sizes as PNGs, resized by sips) packed by iconutil.
      - name: Make an .icns with Apple's own iconutil
        run: |
          mkdir apple.iconset
          for spec in "16 icon_16x16" "32 icon_16x16@2x" "32 icon_32x32" "64 icon_32x32@2x"                       "128 icon_128x128" "256 icon_128x128@2x" "256 icon_256x256"                       "512 icon_256x256@2x" "512 icon_512x512" "1024 icon_512x512@2x"; do
            set -- $spec
            sips -z "$1" "$1" .github/testdata/logo.png --out "apple.iconset/$2.png" > /dev/null
          done
          iconutil -c icns apple.iconset -o apple.icns
          ls -la apple.icns

      # img2ico has to read it, and take its LARGEST icon (1024 px) as the
      # source - not one of the small ones.
      - name: Read Apple's .icns as a source image
        run: |
          ./target/release/img2ico apple.icns --output-format ico -o from-apple.ico --sizes 32,256 --force --verbose 2> verbose.txt
          cat verbose.txt
          grep -F "(1024x1024 pixels)" verbose.txt
          ./target/release/img2ico --inspect from-apple.ico
          ./target/release/img2ico --validate from-apple.ico
          ./target/release/img2ico --extract from-apple.ico -o from-apple-pngs --force
          sips -g pixelWidth -g pixelHeight from-apple-pngs/from-apple_256x256.png | grep -F "pixelWidth: 256"

      # The same through standard input, and through --inspect.
      - name: Read Apple's .icns from standard input and inspect it
        run: |
          ./target/release/img2ico - -o from-stdin.ico --output-format ico --sizes 32 --force < apple.icns
          ls -la from-stdin.ico
          ./target/release/img2ico --inspect apple.icns

      # An .icns written by "sips" itself, in whatever icon types it
      # chooses (older macOS versions used RLE-compressed and JPEG 2000
      # entries). This one is informational about what exists in the wild:
      # img2ico must read it, because the PNG entries are always there.
      - name: Read an .icns written by sips
        run: |
          sips -s format icns .github/testdata/logo.png --out sips.icns
          ls -la sips.icns
          ./target/release/img2ico sips.icns --output-format ico -o from-sips-icns.ico --sizes 32 --force --verbose

      # Raster files written by Apple's image encoders (TIFF with Apple's
      # compression, JPEG, BMP, GIF, TGA).
      - name: Read raster files written by sips
        run: |
          for format in tiff jpeg bmp gif tga; do
            extension="$format"
            if [ "$format" = "jpeg" ]; then extension=jpg; fi
            sips -s format "$format" .github/testdata/logo.png --out "apple.$extension"
            ./target/release/img2ico "apple.$extension" --output-format ico -o "from-$extension.ico" --sizes 32 --force
            test -s "from-$extension.ico"
            echo "read apple.$extension: OK"
          done

      - name: Upload the generated .icns and its decomposed iconset
        uses: actions/upload-artifact@v7
        with:
          name: icns-verification
          path: |
            test.icns
            verified.iconset
            apple.icns
            sips.icns
            from-apple.ico
